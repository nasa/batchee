name: Test Docker build on PR

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  docker:
    uses: ./.github/workflows/reusable-docker.yml
